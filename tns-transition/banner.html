<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; }

  /* ---- Banner (copy from here to the end of the banner markup if pasting into WordPress) ---- */
  .fgl-tns-banner, .fgl-tns-banner * { box-sizing: border-box; }
  .fgl-tns-banner {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 8px 18px;
    min-height: 56px; padding: 10px 24px;
    background: #3B3B3B; color: #FFFFFF;
    font-family: 'Prometo', 'Exo 2', Arial, sans-serif;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .fgl-tns-banner__text { font-size: 16px; font-weight: 400; line-height: 1.3; }
  .fgl-tns-banner__btn {
    display: inline-flex; align-items: center;
    min-height: 34px; padding: 0 20px; border-radius: 30px;
    background: #F58A21; color: #262626 !important;
    font-family: inherit; font-size: 14px; font-weight: 700;
    text-decoration: none !important; white-space: nowrap;
    transition: filter .15s ease;
  }
  .fgl-tns-banner__btn:hover { filter: brightness(1.06); color: #262626; }
  .fgl-tns-banner__btn:focus-visible { outline: 3px solid #29D9CF; outline-offset: 2px; }

  @media (max-width: 600px) {
    .fgl-tns-banner { flex-direction: column; min-height: 96px; padding: 12px 16px; }
    .fgl-tns-banner__text { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="fgl-tns-banner" role="region" aria-label="Announcement">
  <span class="fgl-tns-banner__text">Fresh Green Light is joining The Next Street.</span>
  <a class="fgl-tns-banner__btn" href="https://freshgreenlight.com/the-next-street/" target="_top">What it means for you</a>
</div>

</body>
</html>
